# Builds the Eden Duo Android APK (arm64-v8a) on GitHub Actions.
# Run it from the Actions tab ("Build Android APK" -> "Run workflow") or by pushing to the branch.
# The APK is attached to the run as the "EdenDuo-apk" artifact.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, duo-rp-optimizations]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake (versions from app/build.gradle.kts)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "ndk;30.0.16248370" "cmake;3.31.6"

      - name: Cache Gradle and CPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/cpm
          key: eden-duo-${{ runner.os }}-${{ hashFiles('src/android/**/*.kts', 'cpmfile.json') }}

      - name: Build (mainline, relWithDebInfo)
        working-directory: src/android
        run: |
          export CPM_SOURCE_CACHE="$HOME/.cache/cpm"
          chmod +x gradlew
          ./gradlew --no-daemon assembleMainlineRelWithDebInfo

      - uses: actions/upload-artifact@v4
        with:
          name: EdenDuo-apk
          path: src/android/app/build/outputs/apk/mainline/relWithDebInfo/*.apk
          if-no-files-found: error
