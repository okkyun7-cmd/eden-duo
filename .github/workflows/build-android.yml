# Builds the Eden Duo Android APK (arm64-v8a) on GitHub Actions.
# Run it from the Actions tab ("Build Android APK" -> "Run workflow") or by pushing to the branch.
# The APK is attached to the run as the "EdenDuo-apk" artifact.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, duo-rp-optimizations]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host tools (shader compiler)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools
          glslangValidator --version | head -1

      # The ubuntu runner already ships an Android SDK; use its sdkmanager directly.
      - name: Install NDK and CMake (versions from app/build.gradle.kts)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6"

      - name: Cache Gradle and CPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/cpm
          key: eden-duo-${{ runner.os }}-${{ hashFiles('src/android/**/*.kts', 'cpmfile.json') }}

      - name: Build (mainline, relWithDebInfo)
        working-directory: src/android
        run: |
          export CPM_SOURCE_CACHE="$HOME/.cache/cpm"
          chmod +x gradlew
          GRADLE_OPTS="-Dorg.gradle.parallel=false -Dorg.gradle.workers.max=$(nproc)"
          # Native first: CMake configure generates the SDL Java sources the Kotlin compile needs.
          ./gradlew --no-daemon $GRADLE_OPTS :app:externalNativeBuildMainlineRelWithDebInfo
          ./gradlew --no-daemon $GRADLE_OPTS assembleMainlineRelWithDebInfo

      - uses: actions/upload-artifact@v4
        with:
          name: EdenDuo-apk
          path: src/android/app/build/outputs/apk/mainline/relWithDebInfo/*.apk
          if-no-files-found: error
